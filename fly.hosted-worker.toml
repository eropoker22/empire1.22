primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile.hosted-worker"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  EMPIRE_PERSISTENCE_DRIVER = "postgres"
  GAMEPLAY_PERSISTENCE_DRIVER = "postgres"
  EMPIRE_HOSTED_PREFLIGHT_STRICT = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[restart]]
  policy = "on-failure"
  retries = 10

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
  cpu_kind = "shared"
