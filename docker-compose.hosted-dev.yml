services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: empire_hosted_dev
      POSTGRES_USER: empire_dev
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U empire_dev -d empire_hosted_dev"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - empire_hosted_postgres:/var/lib/postgresql/data

volumes:
  empire_hosted_postgres:
