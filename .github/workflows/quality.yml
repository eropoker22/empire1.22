name: Quality

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint, typecheck and builds
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build admin page and Netlify Functions
        run: npm run build:admin:page

      - name: Build hosted worker bundle
        run: npm run build:hosted-worker

      - name: Build immutable worker image
        if: github.event_name == 'push'
        run: docker build --build-arg EMPIRE_BUILD_SHA=${{ github.sha }} --tag empire-hosted-worker:${{ github.sha }} --file Dockerfile.hosted-worker .

  tests:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Unit tests
            command: test:unit
          - label: Integration tests
            command: test:integration
          - label: Server tests
            command: test:server
          - label: Persistence tests
            command: test:persistence
          - label: Read-model tests
            command: test:read-models
          - label: Critical recovery tests
            command: test:recovery:critical

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run ${{ matrix.label }}
        run: npm run ${{ matrix.command }}

  e2e-smoke:
    name: E2E smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke
        run: npm run test:e2e:smoke

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-e2e-smoke-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            playwright-report/**
            test-results/**
