name: Staging Remote Acceptance

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact deployed 40-character staging SHA
        required: true
        type: string
      staging_deploy_run_id:
        description: Successful Deploy Staging workflow run ID for this SHA
        required: true
        type: string
      soak_minutes:
        description: Staging soak duration in minutes, from 120 through 240
        required: true
        default: "180"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: empire-staging-remote-acceptance
  cancel-in-progress: false

jobs:
  gate:
    name: Verify immutable staging deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_sha: ${{ steps.release.outputs.sha }}
      short_sha: ${{ steps.release.outputs.short_sha }}
      deploy_run_id: ${{ steps.release.outputs.deploy_run_id }}
      soak_minutes: ${{ steps.release.outputs.soak_minutes }}

    steps:
      - name: Resolve exact approved deployment
        id: release
        env:
          DISPATCH_SHA: ${{ inputs.sha }}
          DISPATCH_DEPLOY_RUN_ID: ${{ inputs.staging_deploy_run_id }}
          DISPATCH_SOAK_MINUTES: ${{ inputs.soak_minutes }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DISPATCH_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DISPATCH_DEPLOY_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$DISPATCH_SOAK_MINUTES" =~ ^[0-9]+$ ]]
          (( DISPATCH_SOAK_MINUTES >= 120 && DISPATCH_SOAK_MINUTES <= 240 ))
          echo "sha=$DISPATCH_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=${DISPATCH_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "deploy_run_id=$DISPATCH_DEPLOY_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "soak_minutes=$DISPATCH_SOAK_MINUTES" >> "$GITHUB_OUTPUT"

      - name: Checkout exact deployed SHA for policy validation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.release.outputs.sha }}

      - name: Setup Node 24 for policy validation
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: Verify successful Deploy Staging run
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          DEPLOY_RUN_ID: ${{ steps.release.outputs.deploy_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${DEPLOY_RUN_ID}")"
          jq -e --arg sha "$RELEASE_SHA" '
            .name == "Deploy Staging" and
            .path == ".github/workflows/deploy-staging.yml" and
            .status == "completed" and
            .conclusion == "success" and
            .head_sha == $sha
          ' <<< "$run_json" >/dev/null

      - name: Verify staging release artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          DEPLOY_RUN_ID: ${{ steps.release.outputs.deploy_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gate-evidence
          gh run download "$DEPLOY_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "staging-release-${RELEASE_SHA}" --dir gate-evidence
          manifest="gate-evidence/artifacts/release-manifest.json"
          remote="gate-evidence/artifacts/release/staging/remote-release-health.json"
          backup="gate-evidence/artifacts/release/staging/database-backup.json"
          binding="gate-evidence/artifacts/release/staging/neon-target-binding.json"
          registration="gate-evidence/artifacts/release/staging/registration-policy.json"
          [[ -s "$manifest" && -s "$remote" && -s "$backup" && -s "$binding" && -s "$registration" ]]
          jq -e --arg sha "$RELEASE_SHA" '
            .gitSha == $sha and
            .frontendBuildSha == $sha and
            .apiBuildSha == $sha and
            .workerBuildSha == $sha and
            .environment == "staging" and
            .targetEnvironment == "staging"
          ' "$manifest" >/dev/null
          jq -e --arg sha "$RELEASE_SHA" '
            .frontendSha == $sha and .apiSha == $sha and .workerSha == $sha and
            .environment == "staging" and .region == "fra"
          ' "$remote" >/dev/null
          jq -e --arg sha "$RELEASE_SHA" '
            .schemaVersion == 1 and .status == "verified" and .environment == "staging" and
            keys == ["branchIdHash","databaseTargetHash","endpointIdHash","environment","projectIdHash","releaseSha","schemaVersion","status"] and
            .releaseSha == $sha and
            (.databaseTargetHash | test("^[0-9a-f]{64}$")) and
            (.projectIdHash | test("^[0-9a-f]{64}$")) and
            (.branchIdHash | test("^[0-9a-f]{64}$")) and
            (.endpointIdHash | test("^[0-9a-f]{64}$"))
          ' "$binding" >/dev/null
          jq -e --arg sha "$RELEASE_SHA" --slurpfile binding "$binding" '
            .schemaVersion == 1 and .status == "verified" and
            keys == ["branchIdHash","databaseTargetHash","endpointIdHash","environment","name","operationCount","operationSetHash","projectIdHash","schemaVersion","sha","snapshotIdHash","status"] and
            .environment == "staging" and .sha == $sha and
            (.snapshotIdHash | test("^[0-9a-f]{16}$")) and
            (.operationSetHash | test("^[0-9a-f]{64}$")) and
            ((.operationCount | type) == "number") and
            .operationCount >= 0 and (.operationCount | floor) == .operationCount and
            .databaseTargetHash == $binding[0].databaseTargetHash and
            .projectIdHash == $binding[0].projectIdHash and
            .branchIdHash == $binding[0].branchIdHash and
            .endpointIdHash == $binding[0].endpointIdHash
          ' "$backup" >/dev/null
          jq -e --arg sha "$RELEASE_SHA" '
            .schemaVersion == 1 and .status == "verified" and .environment == "staging" and
            .buildSha == $sha and .registrationMode == "open" and .registrationOpen == true and
            .registrationExpiresAt == null and .publicPolicy.accepted == true and
            .publicPolicy.registrationEnabled == true and .publicPolicy.mode == "open" and
            .publicPolicy.expiresAt == null
          ' "$registration" >/dev/null

  code-evidence:
    name: Canonical code-level release evidence
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RELEASE_SHA: ${{ needs.gate.outputs.release_sha }}
      EMPIRE_PRE_ALPHA_STAGING_ARTIFACT_ROOT: artifacts/pre-alpha-staging

    steps:
      - name: Checkout exact deployed SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Verify exact clean checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]
          [[ -z "$(git status --porcelain --untracked-files=all)" ]]

      - name: Install exact dependencies
        run: npm ci

      - name: Run canonical non-live code gate
        run: npm run verify:pre-alpha:staging

      - name: Verify command-result evidence
        shell: bash
        run: |
          set -euo pipefail
          jq -e --arg sha "$RELEASE_SHA" '
            .status == "code-passed" and .buildSha == $sha and
            (.phases | length) == 7 and all(.phases[]; .status == "passed")
          ' artifacts/pre-alpha-staging/summary.json >/dev/null
          jq -e --arg sha "$RELEASE_SHA" '
            .status == "passed" and .buildSha == $sha and
            .evidenceKind == "canonical-command-results" and .phase == "security" and
            (.commands | length) > 0 and all(.commands[]; .status == "passed")
          ' artifacts/pre-alpha-staging/security/summary.json >/dev/null
          jq -e --arg sha "$RELEASE_SHA" '
            .status == "passed" and .buildSha == $sha and
            .evidenceKind == "canonical-command-results" and .phase == "concurrency" and
            (.commands | length) == 1 and all(.commands[]; .status == "passed")
          ' artifacts/pre-alpha-staging/concurrency/code-summary.json >/dev/null
          jq -e --arg sha "$RELEASE_SHA" '
            .status == "passed" and .buildSha == $sha and
            .evidenceKind == "canonical-command-results" and .phase == "simulation" and
            (.commands | length) > 0 and all(.commands[]; .status == "passed")
          ' artifacts/pre-alpha-staging/simulation/balance-report.json >/dev/null

      - name: Upload canonical code evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-pre-alpha-code-${{ env.RELEASE_SHA }}
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/pre-alpha-staging/summary.json
            artifacts/pre-alpha-staging/security/summary.json
            artifacts/pre-alpha-staging/concurrency/code-summary.json
            artifacts/pre-alpha-staging/simulation/balance-report.json

  open-registration:
    name: Open time-limited staging registration
    needs:
      - gate
      - code-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    outputs:
      registration_expires_at: ${{ steps.registration.outputs.expires_at }}
    env:
      RELEASE_SHA: ${{ needs.gate.outputs.release_sha }}
      STAGING_ORIGIN: https://staging.empirestreets.cz
      NETLIFY_SITE_ID: ${{ vars.NETLIFY_STAGING_SITE_ID }}
      NETLIFY_PRODUCTION_SITE_ID: ${{ vars.NETLIFY_PRODUCTION_SITE_ID }}
      NETLIFY_DISABLE_UPDATE_CHECK: "true"
      FLY_STAGING_APP: ${{ vars.FLY_STAGING_APP }}
      EMPIRE_PRE_ALPHA_STAGING_FLY_APP: empire-streets-staging-worker
      NODE_ENV: production
      EMPIRE_RELEASE_ENVIRONMENT: staging
      EMPIRE_PUBLIC_ORIGIN: https://staging.empirestreets.cz
      EMPIRE_ALLOWED_ORIGINS: https://staging.empirestreets.cz
      EMPIRE_BUILD_SHA: ${{ needs.gate.outputs.release_sha }}
      EMPIRE_RUNTIME_REGION: fra
      EMPIRE_HOSTED_WORKER_REGION: fra

    steps:
      - name: Checkout exact deployed SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Verify exact clean source and registration kill-switch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]
          [[ -z "$(git status --porcelain --untracked-files=all)" ]]
          [[ "$FLY_STAGING_APP" == "empire-streets-staging-worker" ]]
          [[ "$EMPIRE_PRE_ALPHA_STAGING_FLY_APP" == "empire-streets-staging-worker" ]]
          [[ "$FLY_STAGING_APP" == "$EMPIRE_PRE_ALPHA_STAGING_FLY_APP" ]]
          rg --quiet 'EMPIRE_CLOSED_ALPHA_REGISTRATION_EXPIRES_AT' apps/server/src/player-entry/account-registration-policy.ts

      - name: Install exact dependencies
        run: npm ci

      - name: Install pinned Netlify CLI
        run: npm install --global netlify-cli@26.2.0

      - name: Build exact registration deployment
        shell: bash
        run: |
          set -euo pipefail
          npm run release:staging:manifest:code-level
          npm run build:admin:page
          npm run release:asset-manifest

      - name: Verify exact staging Netlify site target before mutation
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$NETLIFY_SITE_ID" =~ ^[A-Za-z0-9-]{8,100}$ ]]
          [[ "$NETLIFY_PRODUCTION_SITE_ID" =~ ^[A-Za-z0-9-]{8,100}$ ]]
          [[ "$NETLIFY_SITE_ID" != "$NETLIFY_PRODUCTION_SITE_ID" ]]
          site="$RUNNER_TEMP/netlify-staging-site.json"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${NETLIFY_AUTH_TOKEN}" \
            "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}" -o "$site"
          jq -e --arg id "$NETLIFY_SITE_ID" '
            def normalized_host:
              if type != "string" then ""
              else ascii_downcase | sub("^https?://"; "") | sub("/.*$"; "") | sub("\\.$"; "")
              end;
            ([.custom_domain, .url, .ssl_url] + (.domain_aliases // []) | map(normalized_host)) as $hosts |
            .id == $id and
            ($hosts | any(. == "staging.empirestreets.cz")) and
            ($hosts | all(. != "empirestreets.cz" and . != "www.empirestreets.cz"))
          ' "$site" >/dev/null
          rm -f "$site"

      - name: Upload immutable registration build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-registration-build-${{ env.RELEASE_SHA }}
          if-no-files-found: error
          retention-days: 30
          path: |
            client/**
            netlify/functions/**
            artifacts/release-manifest.json
            artifacts/release-asset-manifest.json
            netlify.toml

      - name: Open a maximum 23-hour registration window
        id: registration
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$NETLIFY_AUTH_TOKEN" && -n "$NETLIFY_SITE_ID" ]]
          expires_at="$(date -u -d '+23 hours' '+%Y-%m-%dT%H:%M:%S.000Z')"
          EMPIRE_CLOSED_ALPHA_REGISTRATION_ENABLED=true \
          EMPIRE_CLOSED_ALPHA_REGISTRATION_EXPIRES_AT="$expires_at" \
            node --input-type=module -e '
              import { validatePublicRegistrationWindow } from "./scripts/registration-window-contract.mjs";
              if (!validatePublicRegistrationWindow({ enabled: true, expiresAt: process.env.EMPIRE_CLOSED_ALPHA_REGISTRATION_EXPIRES_AT }).valid) process.exit(1);
            '
          netlify env:set EMPIRE_CLOSED_ALPHA_REGISTRATION_EXPIRES_AT "$expires_at" \
            --site "$NETLIFY_SITE_ID" --filter @empire/client --force --scope functions >/dev/null
          netlify env:set EMPIRE_CLOSED_ALPHA_REGISTRATION_EXPIRES_AT "$expires_at" \
            --site "$NETLIFY_SITE_ID" --filter @empire/client --force --context production >/dev/null
          netlify env:set EMPIRE_CLOSED_ALPHA_REGISTRATION_ENABLED true \
            --site "$NETLIFY_SITE_ID" --filter @empire/client --force --scope functions >/dev/null
          netlify env:set EMPIRE_CLOSED_ALPHA_REGISTRATION_ENABLED true \
            --site "$NETLIFY_SITE_ID" --filter @empire/client --force --context production >/dev/null
          mkdir -p artifacts/release/staging/remote-acceptance
          netlify deploy --prod --site "$NETLIFY_SITE_ID" --dir=client --functions=netlify/functions --skip-functions-cache \
            --message "staging remote acceptance open ${RELEASE_SHA}" --json \
            > artifacts/release/staging/remote-acceptance/netlify-open-registration.json
          echo "expires_at=$expires_at" >> "$GITHUB_OUTPUT"

      - name: Verify registration and release parity
        env:
          EMPIRE_HOSTED_WORKER_ORIGIN: https://empire-streets-staging-worker.fly.dev
          EMPIRE_REMOTE_RELEASE_EVIDENCE_PATH: artifacts/release/staging/remote-acceptance/open-release-health.json
        shell: bash
        run: |
          set -euo pipefail
          policy="$RUNNER_TEMP/open-registration-policy.json"
          for attempt in {1..60}; do
            if curl --fail --silent --show-error \
              --header 'Cache-Control: no-cache' \
              "${STAGING_ORIGIN}/api/account/registration-policy?release-sha=${RELEASE_SHA}" -o "$policy" \
              && jq -e '.accepted == true and .data.registrationEnabled == true and .data.mode == "open"' "$policy" >/dev/null; then
              break
            fi
            [[ "$attempt" != "60" ]] || exit 1
            sleep 5
          done
          npm run verify:remote-release
          jq '{accepted,data:{registrationEnabled:.data.registrationEnabled,mode:.data.mode,termsVersion:.data.termsVersion}}' \
            "$policy" > artifacts/release/staging/remote-acceptance/registration-open.json
          rm -f "$policy"

      - name: Upload registration-open evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-registration-open-${{ env.RELEASE_SHA }}
          if-no-files-found: warn
          retention-days: 30
          path: artifacts/release/staging/remote-acceptance/**

  remote-suites:
    name: ${{ matrix.label }}
    needs:
      - gate
      - code-evidence
      - open-registration
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    environment: staging
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          # BEGIN GENERATED RELEASE SUITES: staging-remote-acceptance
          - label: remote-manual-admin-player
            suite: manual-admin-player
            timeout: 50
            fixture: false
            restart_worker: false
          - label: remote-canonical-20p-registration
            suite: canonical-20p-registration
            timeout: 60
            fixture: false
            restart_worker: false
          - label: remote-full-lifecycle-20p
            suite: full-lifecycle-20p
            timeout: 120
            fixture: true
            restart_worker: true
          - label: remote-ui-parity
            suite: ui-parity
            timeout: 120
            fixture: false
            restart_worker: false
          - label: remote-ui-parity-social
            suite: ui-parity-social
            timeout: 90
            fixture: false
            restart_worker: false
          - label: remote-production-pharmacy
            suite: production-pharmacy
            timeout: 50
            fixture: false
            restart_worker: false
          - label: remote-production-drug-lab
            suite: production-drug-lab
            timeout: 50
            fixture: false
            restart_worker: false
          - label: remote-production-factory
            suite: production-factory
            timeout: 50
            fixture: false
            restart_worker: false
          - label: remote-production-armory
            suite: production-armory
            timeout: 50
            fixture: false
            restart_worker: false
          - label: remote-income
            suite: income
            timeout: 50
            fixture: false
            restart_worker: true
          - label: remote-building-actions-day
            suite: building-actions-day
            timeout: 50
            fixture: true
            restart_worker: false
          - label: remote-building-actions-night
            suite: building-actions-night
            timeout: 50
            fixture: true
            restart_worker: false
          - label: remote-ui-parity-non-spawn
            suite: ui-parity-non-spawn
            timeout: 90
            fixture: true
            restart_worker: false
          - label: remote-multiplayer-visible-actions
            suite: multiplayer-visible-actions
            timeout: 90
            fixture: true
            restart_worker: false
          - label: remote-city-events
            suite: city-events
            timeout: 50
            fixture: true
            restart_worker: false
          - label: remote-social-visible-ui
            suite: social-visible-ui
            timeout: 60
            fixture: true
            restart_worker: false
          - label: remote-social-concurrency-privacy
            suite: social-concurrency-privacy
            timeout: 60
            fixture: true
            restart_worker: false
          - label: remote-lifecycle-stop
            suite: lifecycle-stop
            timeout: 50
            fixture: false
            restart_worker: false
          # END GENERATED RELEASE SUITES: staging-remote-acceptance

    env:
      RELEASE_SHA: ${{ needs.gate.outputs.release_sha }}
      NODE_ENV: production
      EMPIRE_RELEASE_ENVIRONMENT: staging
      EMPIRE_PUBLIC_ORIGIN: https://staging.empirestreets.cz
      EMPIRE_BUILD_SHA: ${{ needs.gate.outputs.release_sha }}
      EMPIRE_ADMIN_BOOTSTRAP_USERNAME: ${{ vars.STAGING_ADMIN_USERNAME }}
      EMPIRE_REMOTE_STAGING_ARTIFACT_ROOT: artifacts/remote-staging/${{ matrix.suite }}
      FLY_STAGING_APP: ${{ vars.FLY_STAGING_APP }}
      EMPIRE_PRE_ALPHA_STAGING_FLY_APP: empire-streets-staging-worker

    steps:
      - name: Checkout exact deployed SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Verify exact clean checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]
          [[ -z "$(git status --porcelain --untracked-files=all)" ]]
          [[ "$FLY_STAGING_APP" == "empire-streets-staging-worker" ]]
          [[ "$EMPIRE_PRE_ALPHA_STAGING_FLY_APP" == "empire-streets-staging-worker" ]]
          [[ "$FLY_STAGING_APP" == "$EMPIRE_PRE_ALPHA_STAGING_FLY_APP" ]]

      - name: Install exact dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Setup pinned Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Run public remote suite
        if: matrix.fixture == false && matrix.restart_worker == false
        env:
          EMPIRE_ADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
        run: npm run test:remote-staging:suite -- --suite=${{ matrix.suite }}

      - name: Run worker-restart remote suite
        if: matrix.fixture == false && matrix.restart_worker == true
        env:
          EMPIRE_ADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: npm run test:remote-staging:suite -- --suite=${{ matrix.suite }}

      - name: Run fixture-backed remote suite
        if: matrix.fixture == true && matrix.restart_worker == false
        env:
          EMPIRE_ADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
          EMPIRE_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL_DIRECT }}
          GAMEPLAY_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL_DIRECT }}
          EMPIRE_STAGING_DATABASE_TARGET_HASH: ${{ vars.EMPIRE_STAGING_DATABASE_TARGET_HASH }}
          EMPIRE_PRODUCTION_DATABASE_TARGET_HASH: ${{ vars.EMPIRE_PRODUCTION_DATABASE_TARGET_HASH }}
          NEON_PRODUCTION_PROJECT_ID: ${{ vars.NEON_PRODUCTION_PROJECT_ID }}
          NEON_PRODUCTION_ROOT_BRANCH_ID: ${{ vars.NEON_PRODUCTION_ROOT_BRANCH_ID }}
        run: npm run test:remote-staging:suite -- --suite=${{ matrix.suite }}

      - name: Run fixture-backed worker-recovery remote suite
        if: matrix.fixture == true && matrix.restart_worker == true
        env:
          EMPIRE_ADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          EMPIRE_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL_DIRECT }}
          GAMEPLAY_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL_DIRECT }}
          EMPIRE_STAGING_DATABASE_TARGET_HASH: ${{ vars.EMPIRE_STAGING_DATABASE_TARGET_HASH }}
        run: npm run test:remote-staging:suite -- --suite=${{ matrix.suite }}

      - name: Verify no skips or retries
        env:
          SUITE: ${{ matrix.suite }}
        shell: bash
        run: |
          set -euo pipefail
          summary="artifacts/remote-staging/${SUITE}/summary.json"
          node scripts/validate-release-critical-suite-summary.mjs \
            "--summary=$summary" \
            "--suite=$SUITE" \
            "--build-sha=$RELEASE_SHA"

      - name: Upload remote suite evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-remote-${{ matrix.suite }}-${{ env.RELEASE_SHA }}
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/remote-staging/${{ matrix.suite }}/**
            !artifacts/remote-staging/${{ matrix.suite }}/**/trace.zip

  worker-redeploy:
    name: Redeploy immutable staging worker
    needs:
      - gate
      - remote-suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      RELEASE_SHA: ${{ needs.gate.outputs.release_sha }}
      FLY_STAGING_APP: ${{ vars.FLY_STAGING_APP }}
      EMPIRE_PRE_ALPHA_STAGING_FLY_APP: empire-streets-staging-worker

    steps:
      - name: Checkout exact deployed SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Verify exact clean checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]
          [[ -z "$(git status --porcelain --untracked-files=all)" ]]
          [[ "$FLY_STAGING_APP" == "empire-streets-staging-worker" ]]
          [[ "$EMPIRE_PRE_ALPHA_STAGING_FLY_APP" == "empire-streets-staging-worker" ]]
          [[ "$FLY_STAGING_APP" == "$EMPIRE_PRE_ALPHA_STAGING_FLY_APP" ]]

      - name: Setup pinned Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Redeploy exactly one immutable worker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          flyctl deploy --app "$FLY_STAGING_APP" --config fly.hosted-worker.toml \
            --image "registry.fly.io/${FLY_STAGING_APP}:${RELEASE_SHA}" \
            --ha=false --strategy immediate --yes
          flyctl scale count 1 --app "$FLY_STAGING_APP" --yes
          machines="$(flyctl machines list --app "$FLY_STAGING_APP" --json)"
          jq -e '[.[] | select(.state != "destroyed" and .state != "destroying")] | length == 1' <<< "$machines" >/dev/null

      - name: Verify worker recovery and SHA parity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/remote-staging/worker-redeploy
          worker="$RUNNER_TEMP/worker-health.json"
          api="$RUNNER_TEMP/api-health.json"
          for attempt in {1..60}; do
            if curl --fail --silent --show-error "https://${FLY_STAGING_APP}.fly.dev/health" -o "$worker" \
              && curl --fail --silent --show-error "https://staging.empirestreets.cz/api/health" -o "$api" \
              && jq -e --arg sha "$RELEASE_SHA" '.status == "ok" and .buildSha == $sha and .environment == "staging" and .heartbeat.registered == true' "$worker" >/dev/null \
              && jq -e --arg sha "$RELEASE_SHA" '.status == "ready" and .apiBuildSha == $sha and .environment == "staging"' "$api" >/dev/null \
              && [[ "$(jq -r '.schemaVersion' "$worker")" == "$(jq -r '.schemaVersion' "$api")" ]]; then
              break
            fi
            [[ "$attempt" != "60" ]] || exit 1
            sleep 5
          done
          jq '{status,buildSha,environment,region,schemaVersion,expectedSchemaVersion,workerId,heartbeat}' \
            "$worker" > artifacts/remote-staging/worker-redeploy/worker-health.json
          jq '{status,apiBuildSha,environment,region,schemaVersion,expectedSchemaVersion}' \
            "$api" > artifacts/remote-staging/worker-redeploy/api-health.json
          rm -f "$worker" "$api"

      - name: Upload worker redeploy evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-worker-redeploy-${{ env.RELEASE_SHA }}
          if-no-files-found: error
          retention-days: 30
          path: artifacts/remote-staging/worker-redeploy/**

  load-soak:
    name: Remote 20-player load and soak
    needs:
      - gate
      - worker-redeploy
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: staging
    env:
      RELEASE_SHA: ${{ needs.gate.outputs.release_sha }}
      NODE_ENV: production
      EMPIRE_RELEASE_ENVIRONMENT: staging
      EMPIRE_PUBLIC_ORIGIN: https://staging.empirestreets.cz
      EMPIRE_ALLOWED_ORIGINS: https://staging.empirestreets.cz
      EMPIRE_BUILD_SHA: ${{ needs.gate.outputs.release_sha }}
      EMPIRE_HOSTED_WORKER_ORIGIN: https://empire-streets-staging-worker.fly.dev
      EMPIRE_ADMIN_BOOTSTRAP_USERNAME: ${{ vars.STAGING_ADMIN_USERNAME }}
      EMPIRE_REMOTE_STAGING_ARTIFACT_ROOT: artifacts/remote-staging/load-soak
      EMPIRE_REMOTE_LOAD_SOAK_MINUTES: ${{ needs.gate.outputs.soak_minutes }}
      EMPIRE_REMOTE_MAX_DB_CONNECTIONS: ${{ vars.EMPIRE_REMOTE_MAX_DB_CONNECTIONS }}
      EMPIRE_REMOTE_MAX_WORKER_MEMORY_BYTES: ${{ vars.EMPIRE_REMOTE_MAX_WORKER_MEMORY_BYTES }}
      EMPIRE_REMOTE_MAX_WORKER_CPU_PCT: ${{ vars.EMPIRE_REMOTE_MAX_WORKER_CPU_PCT }}
      EMPIRE_REMOTE_MAX_WORKER_THROTTLE_INCREASE: ${{ vars.EMPIRE_REMOTE_MAX_WORKER_THROTTLE_INCREASE }}
      EMPIRE_STAGING_DATABASE_TARGET_HASH: ${{ vars.EMPIRE_STAGING_DATABASE_TARGET_HASH }}
      FLY_STAGING_APP: ${{ vars.FLY_STAGING_APP }}
      EMPIRE_PRE_ALPHA_STAGING_FLY_APP: empire-streets-staging-worker
      FLY_ORG_SLUG: ${{ vars.FLY_ORG_SLUG }}

    steps:
      - name: Checkout exact deployed SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Verify exact clean checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]
          [[ -z "$(git status --porcelain --untracked-files=all)" ]]
          [[ "$FLY_STAGING_APP" == "empire-streets-staging-worker" ]]
          [[ "$EMPIRE_PRE_ALPHA_STAGING_FLY_APP" == "empire-streets-staging-worker" ]]
          [[ "$FLY_STAGING_APP" == "$EMPIRE_PRE_ALPHA_STAGING_FLY_APP" ]]

      - name: Install exact dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run guarded remote load soak
        env:
          EMPIRE_ADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
          EMPIRE_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL_DIRECT }}
          GAMEPLAY_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL_DIRECT }}
          FLY_METRICS_TOKEN: ${{ secrets.FLY_METRICS_TOKEN }}
        run: npm run test:remote-staging:load-soak

      - name: Verify load, database and Fly thresholds
        shell: bash
        run: |
          set -euo pipefail
          jq -e --arg sha "$RELEASE_SHA" '
            .status == "passed" and .buildSha == $sha and .environment == "staging" and
            .browser.status == "passed" and .browser.counts.total > 0 and
            .browser.counts.executed == .browser.counts.total and
            .browser.counts.passed == .browser.counts.total and .browser.counts.failed == 0 and
            .browser.counts.skipped == 0 and .browser.counts.notRun == 0 and
            .browser.counts.retries == 0 and .browser.counts.flaky == 0 and
            .performance.status == "passed" and .performance.buildSha == $sha and
            .performance.metrics.passed == true and (.performance.metrics.violations | length) == 0 and
            .performance.metrics.actionMix.distinctActualActionCount >= 5 and
            .performance.metrics.actionMix.distinctAcceptedActionCount >= 4 and
            .performance.metrics.actionMix.districtSelectionChangeCount >= 1 and
            .performance.metrics.rejectionClassification.auth == 0 and
            .performance.metrics.rejectionClassification.rateLimit == 0 and
            .performance.metrics.rejectionClassification.unexpected == 0 and
            .database.passed == true and .fly.passed == true and .cleanup == "archived"
          ' artifacts/remote-staging/load-soak/summary.json >/dev/null

      - name: Upload remote load evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-load-soak-${{ env.RELEASE_SHA }}
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/remote-staging/load-soak/**
            !artifacts/remote-staging/load-soak/**/trace.zip

  finalize-registration-policy:
    name: Finalize staging registration policy
    if: always() && needs.gate.result == 'success'
    needs:
      - gate
      - open-registration
      - remote-suites
      - worker-redeploy
      - load-soak
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    env:
      RELEASE_SHA: ${{ needs.gate.outputs.release_sha }}
      DEPLOY_RUN_ID: ${{ needs.gate.outputs.deploy_run_id }}
      REGISTRATION_EXPIRES_AT: ${{ needs.open-registration.outputs.registration_expires_at }}
      STAGING_ORIGIN: https://staging.empirestreets.cz
      NETLIFY_SITE_ID: ${{ vars.NETLIFY_STAGING_SITE_ID }}
      NETLIFY_PRODUCTION_SITE_ID: ${{ vars.NETLIFY_PRODUCTION_SITE_ID }}
      NETLIFY_DISABLE_UPDATE_CHECK: "true"
      NODE_ENV: production
      EMPIRE_RELEASE_ENVIRONMENT: staging
      EMPIRE_PUBLIC_ORIGIN: https://staging.empirestreets.cz
      EMPIRE_ALLOWED_ORIGINS: https://staging.empirestreets.cz
      EMPIRE_BUILD_SHA: ${{ needs.gate.outputs.release_sha }}
      EMPIRE_RUNTIME_REGION: fra
      EMPIRE_HOSTED_WORKER_REGION: fra
      FLY_STAGING_APP: ${{ vars.FLY_STAGING_APP }}
      EMPIRE_PRE_ALPHA_STAGING_FLY_APP: empire-streets-staging-worker

    steps:
      - name: Checkout exact deployed SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: Verify exact clean source and canonical worker target
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]
          [[ -z "$(git status --porcelain --untracked-files=all)" ]]
          [[ "$FLY_STAGING_APP" == "empire-streets-staging-worker" ]]
          [[ "$EMPIRE_PRE_ALPHA_STAGING_FLY_APP" == "empire-streets-staging-worker" ]]
          [[ "$FLY_STAGING_APP" == "$EMPIRE_PRE_ALPHA_STAGING_FLY_APP" ]]

      - name: Install pinned Netlify CLI
        run: npm install --global netlify-cli@26.2.0

      - name: Download immutable registration build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          downloaded=false
          for attempt in {1..12}; do
            if gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "staging-registration-build-${RELEASE_SHA}" --dir .; then
              downloaded=true
              break
            fi
            sleep 10
          done
          [[ "$downloaded" == "true" ]]
          jq -e --arg sha "$RELEASE_SHA" '
            .gitSha == $sha and .frontendBuildSha == $sha and .apiBuildSha == $sha and .workerBuildSha == $sha
          ' artifacts/release-manifest.json >/dev/null
          jq -e --arg sha "$RELEASE_SHA" '.buildSha == $sha' artifacts/release-asset-manifest.json >/dev/null

      - name: Verify exact staging Netlify site target before permanent-open mutation
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$NETLIFY_SITE_ID" =~ ^[A-Za-z0-9-]{8,100}$ ]]
          [[ "$NETLIFY_PRODUCTION_SITE_ID" =~ ^[A-Za-z0-9-]{8,100}$ ]]
          [[ "$NETLIFY_SITE_ID" != "$NETLIFY_PRODUCTION_SITE_ID" ]]
          site="$RUNNER_TEMP/netlify-staging-site.json"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${NETLIFY_AUTH_TOKEN}" \
            "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}" -o "$site"
          jq -e --arg id "$NETLIFY_SITE_ID" '
            def normalized_host:
              if type != "string" then ""
              else ascii_downcase | sub("^https?://"; "") | sub("/.*$"; "") | sub("\\.$"; "")
              end;
            ([.custom_domain, .url, .ssl_url] + (.domain_aliases // []) | map(normalized_host)) as $hosts |
            .id == $id and
            ($hosts | any(. == "staging.empirestreets.cz")) and
            ($hosts | all(. != "empirestreets.cz" and . != "www.empirestreets.cz"))
          ' "$site" >/dev/null
          rm -f "$site"

      - name: Restore permanent registration and redeploy the same SHA
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/release/staging/remote-acceptance
          netlify env:set EMPIRE_CLOSED_ALPHA_REGISTRATION_ENABLED true \
            --site "$NETLIFY_SITE_ID" --filter @empire/client --force --scope functions >/dev/null
          netlify env:set EMPIRE_CLOSED_ALPHA_REGISTRATION_ENABLED true \
            --site "$NETLIFY_SITE_ID" --filter @empire/client --force --context production >/dev/null
          netlify env:unset EMPIRE_CLOSED_ALPHA_REGISTRATION_EXPIRES_AT \
            --site "$NETLIFY_SITE_ID" --filter @empire/client --force --context production >/dev/null
          netlify deploy --prod --site "$NETLIFY_SITE_ID" --dir=client --functions=netlify/functions --skip-functions-cache \
            --message "staging remote acceptance permanent-open ${RELEASE_SHA}" --json \
            > artifacts/release/staging/remote-acceptance/netlify-permanent-registration.json

      - name: Verify final registration policy and exact release parity
        env:
          EMPIRE_HOSTED_WORKER_ORIGIN: https://empire-streets-staging-worker.fly.dev
          EMPIRE_REMOTE_RELEASE_EVIDENCE_PATH: artifacts/release/staging/remote-acceptance/final-release-health.json
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/release/staging/remote-acceptance
          expected_mode="open"
          expected_enabled="true"
          final_expires_at=""
          policy="$RUNNER_TEMP/final-registration-policy.json"
          for attempt in {1..60}; do
            if curl --fail --silent --show-error \
              --header 'Cache-Control: no-cache' \
              "${STAGING_ORIGIN}/api/account/registration-policy?release-sha=${RELEASE_SHA}" -o "$policy" \
              && jq -e --arg mode "$expected_mode" --argjson enabled "$expected_enabled" \
                '.accepted == true and .data.registrationEnabled == $enabled and .data.mode == $mode' "$policy" >/dev/null; then
              break
            fi
            [[ "$attempt" != "60" ]] || exit 1
            sleep 5
          done
          npm run verify:remote-release
          verified_at="$(date -u '+%Y-%m-%dT%H:%M:%S.000Z')"
          jq -n --arg sha "$RELEASE_SHA" --arg mode "$expected_mode" \
            --argjson registrationOpen "$expected_enabled" --arg verifiedAt "$verified_at" \
            --arg registrationExpiresAt "$final_expires_at" --slurpfile policy "$policy" '
              {schemaVersion:1,status:"verified",environment:"staging",buildSha:$sha,
               registrationMode:$mode,registrationOpen:$registrationOpen,
               registrationClosed:($registrationOpen | not),verifiedAt:$verifiedAt,
               registrationExpiresAt:(if $registrationExpiresAt == "" then null else $registrationExpiresAt end),
               publicPolicy:{accepted:$policy[0].accepted,
                 registrationEnabled:$policy[0].data.registrationEnabled,
                 mode:$policy[0].data.mode,expiresAt:$policy[0].data.expiresAt,termsVersion:$policy[0].data.termsVersion}}
            ' > artifacts/release/staging/remote-acceptance/final-registration.json
          rm -f "$policy"

      - name: Upload final registration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-registration-final-${{ env.RELEASE_SHA }}
          if-no-files-found: warn
          retention-days: 30
          path: artifacts/release/staging/remote-acceptance/**

  automated-verdict:
    name: Record automated staging verdict
    if: always()
    needs:
      - gate
      - code-evidence
      - open-registration
      - remote-suites
      - worker-redeploy
      - load-soak
      - finalize-registration-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact deployed SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.gate.outputs.release_sha }}

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: Require every automated gate and verified final registration policy
        env:
          RELEASE_SHA: ${{ needs.gate.outputs.release_sha }}
          REGISTRATION_EXPIRES_AT: ${{ needs.open-registration.outputs.registration_expires_at }}
          CODE_RESULT: ${{ needs.code-evidence.result }}
          OPEN_RESULT: ${{ needs.open-registration.result }}
          SUITES_RESULT: ${{ needs.remote-suites.result }}
          WORKER_RESULT: ${{ needs.worker-redeploy.result }}
          LOAD_RESULT: ${{ needs.load-soak.result }}
          FINALIZE_RESULT: ${{ needs.finalize-registration-policy.result }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CODE_RESULT" == "success" ]]
          [[ "$OPEN_RESULT" == "success" ]]
          [[ "$SUITES_RESULT" == "success" ]]
          [[ "$WORKER_RESULT" == "success" ]]
          [[ "$LOAD_RESULT" == "success" ]]
          [[ "$FINALIZE_RESULT" == "success" ]]
          registration_mode="open"
          registration_open="true"
          registration_expires_at=""
          mkdir -p artifacts/remote-staging/final
          required_suites="$(node --input-type=module -e \
            'import { PRE_ALPHA_ALL_REMOTE_SUITE_NAMES as names } from "./scripts/pre-alpha-staging-contract.mjs"; process.stdout.write(JSON.stringify(names));')"
          verified_at="$(date -u '+%Y-%m-%dT%H:%M:%S.000Z')"
          jq -n --arg sha "$RELEASE_SHA" --arg runId "$GITHUB_RUN_ID" --argjson suites "$required_suites" \
            --arg registrationMode "$registration_mode" --argjson registrationOpen "$registration_open" \
            --arg registrationExpiresAt "$registration_expires_at" --arg verifiedAt "$verified_at" '
            {status:"automated-pass",environment:"staging",buildSha:$sha,workflowRunId:$runId,
             registrationMode:$registrationMode,registrationOpen:$registrationOpen,
             registrationClosed:($registrationOpen | not),
             registrationExpiresAt:(if $registrationExpiresAt == "" then null else $registrationExpiresAt end),
             verifiedAt:$verifiedAt,requiredRemoteSuites:$suites,
             jobResults:{code:"success",openRegistration:"success",remoteSuites:"success",
               workerRedeploy:"success",loadSoak:"success",finalizeRegistrationPolicy:"success"},
             manualNetlifyObservabilityReview:"required-before-production"}
          ' > artifacts/remote-staging/final/summary.json

      - name: Upload automated verdict
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-remote-final-${{ needs.gate.outputs.release_sha }}
          if-no-files-found: error
          retention-days: 90
          path: artifacts/remote-staging/final/summary.json

  evidence-bundle:
    name: Assemble canonical pre-alpha evidence
    if: always() && needs.gate.result == 'success'
    needs:
      - gate
      - code-evidence
      - open-registration
      - remote-suites
      - worker-redeploy
      - load-soak
      - finalize-registration-policy
      - automated-verdict
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_SHA: ${{ needs.gate.outputs.release_sha }}
      DEPLOY_RUN_ID: ${{ needs.gate.outputs.deploy_run_id }}
      CODE_RESULT: ${{ needs.code-evidence.result }}
      OPEN_RESULT: ${{ needs.open-registration.result }}
      SUITES_RESULT: ${{ needs.remote-suites.result }}
      WORKER_RESULT: ${{ needs.worker-redeploy.result }}
      LOAD_RESULT: ${{ needs.load-soak.result }}
      FINALIZE_RESULT: ${{ needs.finalize-registration-policy.result }}
      AUTOMATED_RESULT: ${{ needs.automated-verdict.result }}
      EVIDENCE_ROOT: artifacts/release/staging
      EVIDENCE_OUTPUT: artifacts/release/staging/pre-alpha-hardening-${{ needs.gate.outputs.short_sha }}

    steps:
      - name: Checkout exact deployed SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Download exact named release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          input="$RUNNER_TEMP/pre-alpha-evidence-input"
          mkdir -p "$input"
          download_optional() {
            local run_id="$1" artifact_name="$2" destination="$3"
            mkdir -p "$destination"
            for attempt in {1..6}; do
              if gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
                --name "$artifact_name" --dir "$destination"; then
                return 0
              fi
              sleep 5
            done
            return 0
          }
          download_optional "$GITHUB_RUN_ID" "staging-pre-alpha-code-${RELEASE_SHA}" "$input/code"
          download_optional "$GITHUB_RUN_ID" "staging-remote-full-lifecycle-20p-${RELEASE_SHA}" "$input/lifecycle"
          download_optional "$GITHUB_RUN_ID" "staging-remote-social-concurrency-privacy-${RELEASE_SHA}" "$input/concurrency"
          download_optional "$GITHUB_RUN_ID" "staging-load-soak-${RELEASE_SHA}" "$input/load"
          download_optional "$GITHUB_RUN_ID" "staging-registration-final-${RELEASE_SHA}" "$input/registration"
          download_optional "$GITHUB_RUN_ID" "staging-remote-final-${RELEASE_SHA}" "$input/final"
          download_optional "$DEPLOY_RUN_ID" "staging-release-${RELEASE_SHA}" "$input/deploy"

      - name: Map explicit evidence paths and record the composite gate
        shell: bash
        run: |
          set -euo pipefail
          input="$RUNNER_TEMP/pre-alpha-evidence-input"
          mkdir -p "$EVIDENCE_ROOT"
          copy_first() {
            local destination="$1"
            shift
            for source in "$@"; do
              if [[ -s "$source" ]]; then
                mkdir -p "$(dirname "$destination")"
                cp "$source" "$destination"
                return 0
              fi
            done
            return 0
          }

          copy_first "$EVIDENCE_ROOT/code-level/summary.json" \
            "$input/code/summary.json" \
            "$input/code/artifacts/pre-alpha-staging/summary.json"
          copy_first "$EVIDENCE_ROOT/security/summary.json" \
            "$input/code/security/summary.json" \
            "$input/code/artifacts/pre-alpha-staging/security/summary.json"
          copy_first "$EVIDENCE_ROOT/concurrency/code-summary.json" \
            "$input/code/concurrency/code-summary.json" \
            "$input/code/artifacts/pre-alpha-staging/concurrency/code-summary.json"
          copy_first "$EVIDENCE_ROOT/simulation/balance-report.json" \
            "$input/code/simulation/balance-report.json" \
            "$input/code/artifacts/pre-alpha-staging/simulation/balance-report.json"
          copy_first "$EVIDENCE_ROOT/remote-suites/full-lifecycle-20p/summary.json" \
            "$input/lifecycle/summary.json" \
            "$input/lifecycle/artifacts/remote-staging/full-lifecycle-20p/summary.json"
          copy_first "$EVIDENCE_ROOT/remote-suites/full-lifecycle-20p/lifecycle-report.json" \
            "$input/lifecycle/lifecycle-report.json" \
            "$input/lifecycle/artifacts/remote-staging/full-lifecycle-20p/lifecycle-report.json"
          copy_first "$EVIDENCE_ROOT/remote-suites/full-lifecycle-20p/invariant-report.json" \
            "$input/lifecycle/invariant-report.json" \
            "$input/lifecycle/artifacts/remote-staging/full-lifecycle-20p/invariant-report.json"
          copy_first "$EVIDENCE_ROOT/remote-suites/full-lifecycle-20p/cleanup-report.json" \
            "$input/lifecycle/cleanup-report.json" \
            "$input/lifecycle/artifacts/remote-staging/full-lifecycle-20p/cleanup-report.json"
          copy_first "$EVIDENCE_ROOT/remote-suites/social-concurrency-privacy/summary.json" \
            "$input/concurrency/summary.json" \
            "$input/concurrency/artifacts/remote-staging/social-concurrency-privacy/summary.json"
          copy_first "$EVIDENCE_ROOT/load-soak/summary.json" \
            "$input/load/summary.json" \
            "$input/load/artifacts/remote-staging/load-soak/summary.json"
          copy_first "$EVIDENCE_ROOT/remote-release-health.json" \
            "$input/registration/final-release-health.json" \
            "$input/registration/artifacts/release/staging/remote-acceptance/final-release-health.json" \
            "$input/deploy/artifacts/release/staging/remote-release-health.json"

          final_summary="$input/final/summary.json"
          [[ -s "$final_summary" ]] || final_summary="$input/final/artifacts/remote-staging/final/summary.json"
          final_registration="$input/registration/final-registration.json"
          [[ -s "$final_registration" ]] || final_registration="$input/registration/artifacts/release/staging/remote-acceptance/final-registration.json"
          final_health="$input/registration/final-release-health.json"
          [[ -s "$final_health" ]] || final_health="$input/registration/artifacts/release/staging/remote-acceptance/final-release-health.json"
          expected_registration_mode="open"
          expected_registration_open="true"

          composite_status="failed"
          if [[ "$CODE_RESULT" == "success" && "$OPEN_RESULT" == "success" \
            && "$SUITES_RESULT" == "success" && "$WORKER_RESULT" == "success" \
            && "$LOAD_RESULT" == "success" && "$FINALIZE_RESULT" == "success" \
            && "$AUTOMATED_RESULT" == "success" ]] \
            && jq -e --arg sha "$RELEASE_SHA" \
               '.status == "code-passed" and .buildSha == $sha and (.phases | length) == 8 and all(.phases[]; .status == "passed")' \
              "$EVIDENCE_ROOT/code-level/summary.json" >/dev/null 2>&1 \
            && jq -e --arg sha "$RELEASE_SHA" --arg mode "$expected_registration_mode" \
              --argjson registrationOpen "$expected_registration_open" \
              '.status == "automated-pass" and .environment == "staging" and .buildSha == $sha and
               .registrationMode == $mode and .registrationOpen == $registrationOpen and
               .registrationClosed == ($registrationOpen | not)' \
              "$final_summary" >/dev/null 2>&1 \
            && jq -e --arg sha "$RELEASE_SHA" --arg mode "$expected_registration_mode" \
              --argjson registrationOpen "$expected_registration_open" \
              '.status == "verified" and .environment == "staging" and .buildSha == $sha and
               .registrationMode == $mode and .registrationOpen == $registrationOpen and
               .registrationClosed == ($registrationOpen | not) and
               .publicPolicy.accepted == true and .publicPolicy.registrationEnabled == $registrationOpen and
               .publicPolicy.mode == $mode' \
              "$final_registration" >/dev/null 2>&1 \
            && jq -e --arg sha "$RELEASE_SHA" \
              '.environment == "staging" and .frontendSha == $sha and .apiSha == $sha and .workerSha == $sha' \
              "$final_health" >/dev/null 2>&1; then
            composite_status="passed"
          fi
          jq -n --arg status "$composite_status" --arg sha "$RELEASE_SHA" \
            --arg code "$CODE_RESULT" --arg suites "$SUITES_RESULT" --arg load "$LOAD_RESULT" \
            --arg finalize "$FINALIZE_RESULT" --arg automated "$AUTOMATED_RESULT" '
              {schemaVersion:1,status:$status,buildSha:$sha,evidenceKind:"canonical-composite-command-results",
               jobResults:{code:$code,remoteSuites:$suites,loadSoak:$load,
                 finalizeRegistrationPolicy:$finalize,automatedVerdict:$automated}}
            ' > "$EVIDENCE_ROOT/test-results.json"

          concurrency_status="failed"
          code_concurrency="$EVIDENCE_ROOT/concurrency/code-summary.json"
          remote_concurrency="$EVIDENCE_ROOT/remote-suites/social-concurrency-privacy/summary.json"
          if jq -e --arg sha "$RELEASE_SHA" \
              '.status == "passed" and .buildSha == $sha and .phase == "concurrency" and
               (.commands | length) == 1 and all(.commands[]; .id == "authoritative-concurrency" and .status == "passed")' \
              "$code_concurrency" >/dev/null 2>&1 \
            && jq -e --arg sha "$RELEASE_SHA" \
              '.status == "passed" and .environment == "staging" and .buildSha == $sha and
               .suite == "social-concurrency-privacy" and .cleanup == "archived" and
               (.playwrightRuns | length) > 0 and all(.playwrightRuns[];
                 .status == "passed" and .counts.total > 0 and .counts.executed == .counts.total and
                 .counts.passed == .counts.total and .counts.failed == 0 and .counts.skipped == 0 and
                 .counts.notRun == 0 and .counts.retries == 0 and .counts.flaky == 0)' \
              "$remote_concurrency" >/dev/null 2>&1; then
            concurrency_status="passed"
          fi
          mkdir -p "$EVIDENCE_ROOT/remote-suites/concurrency-conflicts"
          jq -n --arg status "$concurrency_status" --arg sha "$RELEASE_SHA" '
            {schemaVersion:1,status:$status,buildSha:$sha,
             evidenceKind:"code-and-public-staging-concurrency",
             proofs:{authoritativeTransport:$status,publicSocialRaces:$status},
             coverage:["occupy-race","attack-race","normal-market-last-stock",
               "player-market-last-listing","bounty-claim-race","robbery-inventory-race",
               "same-command-replay","payload-conflict","two-tab-invite","alliance-last-slot"]}
          ' > "$EVIDENCE_ROOT/remote-suites/concurrency-conflicts/concurrency-report.json"

      - name: Build sanitized twelve-file evidence bundle
        id: bundle
        continue-on-error: true
        run: >-
          npm run release:pre-alpha:evidence --
          --artifact-root=${{ env.EVIDENCE_ROOT }}
          --build-sha=${{ env.RELEASE_SHA }}

      - name: Upload canonical pre-alpha evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-pre-alpha-hardening-${{ env.RELEASE_SHA }}
          if-no-files-found: error
          retention-days: 90
          path: |
            ${{ env.EVIDENCE_OUTPUT }}/summary.json
            ${{ env.EVIDENCE_OUTPUT }}/summary.md
            ${{ env.EVIDENCE_OUTPUT }}/test-results.json
            ${{ env.EVIDENCE_OUTPUT }}/lifecycle-report.json
            ${{ env.EVIDENCE_OUTPUT }}/concurrency-report.json
            ${{ env.EVIDENCE_OUTPUT }}/invariant-report.json
            ${{ env.EVIDENCE_OUTPUT }}/security-report.json
            ${{ env.EVIDENCE_OUTPUT }}/balance-report.json
            ${{ env.EVIDENCE_OUTPUT }}/performance-report.json
            ${{ env.EVIDENCE_OUTPUT }}/release-health.json
            ${{ env.EVIDENCE_OUTPUT }}/cleanup-report.json
            ${{ env.EVIDENCE_OUTPUT }}/manifest.json

      - name: Require complete release evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ steps.bundle.outcome }}" == "success" ]]
          jq -e --arg sha "$RELEASE_SHA" '
            .status == "passed" and .verdict == "passed" and .buildSha == $sha and
            .counts.required == 9 and .counts.passed == 9 and .counts.failed == 0 and
            .counts.notPassed == 0 and .counts.notRun == 0 and
            (.reports | length) == 9 and all(.reports[]; .status == "passed" and .availability == "present")
          ' "$EVIDENCE_OUTPUT/summary.json" >/dev/null
